name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
      - run: scripts/verify_versions.sh "$GITHUB_REF_NAME"
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Release with Homebrew publication
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release without Homebrew publication
        if: env.HOMEBREW_TAP_TOKEN == ''
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --parallelism=1 --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: .release/checksums.txt

  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: ../../scripts/verify_versions.sh "$GITHUB_REF_NAME"
      - name: Publish npm package
        if: env.NPM_PUBLISH_ENABLED == 'true' && env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
      - name: Report skipped npm publication
        if: env.NPM_PUBLISH_ENABLED != 'true' || env.NODE_AUTH_TOKEN == ''
        run: echo "::notice::Set NPM_PUBLISH_ENABLED=true and configure NPM_TOKEN to publish to npm; skipping npm publication"
