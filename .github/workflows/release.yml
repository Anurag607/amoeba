name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
      - run: scripts/verify_versions.sh "$GITHUB_REF_NAME"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Release with Homebrew publication
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release without Homebrew publication
        if: env.HOMEBREW_TAP_TOKEN == ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --parallelism=1 --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: .release/checksums.txt

  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: ../../scripts/verify_versions.sh "$GITHUB_REF_NAME"
      - name: Publish npm package
        if: env.NPM_PUBLISH_ENABLED == 'true' && env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
      - name: Report skipped npm publication
        if: env.NPM_PUBLISH_ENABLED != 'true' || env.NODE_AUTH_TOKEN == ''
        run: echo "::notice::Set NPM_PUBLISH_ENABLED=true and configure NPM_TOKEN to publish to npm; skipping npm publication"
